[package]
name = "togami"
version = "0.5.0"
description = "A focus timer and distraction blocker for students"
edition = "2021"
publish = false

# Android builds the app as a library (lib.rs); the desktop binary (main.rs) calls it too.
[lib]
name = "togami_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-notification = "2.6"
# Groq requests for the AI help (the same reqwest and rustls the updater already uses)
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# desktop only: self-updates (Android downloads the new APK instead) and one running copy
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.13"
tauri-plugin-single-instance = "2.5"

# Android: HTTPS is checked against these roots (see ai.rs client())
[target.'cfg(target_os = "android")'.dependencies]
webpki-roots = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
