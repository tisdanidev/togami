[package]
name = "togami"
version = "0.4.0"
description = "A focus timer and distraction blocker for students"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-notification = "2.6"
tauri-plugin-updater = "2.13"
tauri-plugin-single-instance = "2.5"
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
