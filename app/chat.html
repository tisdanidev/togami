<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ask · Togami</title>
<link rel="stylesheet" href="fonts/fonts.css" />
<link rel="stylesheet" href="styles.css" />
<style>
  /* The Ask window: a chat with the pet (or Togami) about your work, with
     screen snips. The look follows the main window: paper neutrals, lapis. */
  html, body { height: 100%; overflow: hidden; }
  .chat { display: flex; flex-direction: column; height: 100%; }
  .c-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--side); }
  .c-head b { display: block; font: 400 19px/1.2 var(--serif); }
  .c-head .ctx { font: 500 11.5px var(--mono); color: var(--muted); }
  .c-head .ctx.focus { color: var(--neg); }
  .c-head .ctx.brk { color: var(--pos); }
  .c-head .btn { height: 30px; padding: 0 10px; font-size: 13px; }
  .c-acts { display: flex; gap: 4px; }
  @media (pointer: coarse) { .c-head .btn { height: 36px; } .c-compose textarea { font-size: 16px; } }

  .c-log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .c-empty { margin: auto 8px; text-align: center; color: var(--muted); font-size: 14px; }
  .c-empty h2 { margin: 0 0 6px; font: 400 22px/1.25 var(--serif); color: var(--fg); }
  .msg { max-width: 92%; font-size: 14.5px; line-height: 1.55; overflow-wrap: anywhere; }
  .msg p { margin: 0 0 8px; }
  .msg p:last-child { margin: 0; }
  .msg code { font: 13px var(--mono); background: var(--wash); padding: 1px 4px; border-radius: 4px; }
  .msg.user { align-self: flex-end; background: var(--wash); border-radius: 12px 12px 4px 12px; padding: 8px 12px; }
  .msg.user img { display: block; max-width: 100%; max-height: 160px; border-radius: 6px; margin-bottom: 6px; border: 1px solid var(--border); }
  .msg.bot { align-self: flex-start; }
  .msg.bot .who { font: 500 11px var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--faint); margin-bottom: 2px; }
  .msg.err { align-self: stretch; max-width: none; background: var(--neg-wash); color: var(--neg); border-radius: 8px; padding: 8px 12px; font-size: 13.5px; }
  .msg.err .btn { height: 28px; padding: 0 10px; font-size: 12.5px; margin-top: 6px; }
  .dots { display: inline-flex; gap: 4px; padding: 6px 0; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); animation: dot 1s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%, 80%, 100% { opacity: .3; transform: none; } 40% { opacity: 1; transform: translateY(-2px); } }

  .c-attach { flex: none; display: flex; gap: 10px; align-items: flex-start; padding: 10px 16px 0; }
  .c-attach img { width: 84px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border-strong); flex: none; }
  .c-attach .chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
  .chip { height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface); font-size: 12.5px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .c-attach .x { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 4px; }

  .c-compose { flex: none; display: flex; gap: 8px; align-items: flex-end; padding: 12px 16px 14px; }
  .c-compose textarea { flex: 1; min-height: 40px; max-height: 140px; height: 40px; padding: 9px 12px; resize: none; line-height: 1.4; font-size: 14.5px; }
  .c-compose .btn { height: 40px; }
  .icon-b { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--muted); cursor: pointer; }
  .icon-b:hover { color: var(--accent); border-color: var(--accent); }
  .icon-b:disabled { opacity: .4; cursor: not-allowed; }
  .icon-b svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .c-note { flex: none; padding: 0 16px 10px; font-size: 11.5px; color: var(--faint); }
</style>
</head>
<body>
<div class="chat">
  <header class="c-head">
    <div><b id="who">Togami</b><span class="ctx" id="ctx"></span></div>
    <div class="c-acts">
      <button class="btn quiet" type="button" id="clear" title="Start a new conversation">Clear</button>
      <button class="btn quiet" type="button" id="close" hidden>Close</button>
    </div>
  </header>
  <div class="c-log" id="log" aria-live="polite"></div>
  <div class="c-attach" id="attach" hidden>
    <img id="attachImg" alt="Your snip" />
    <div class="chips">
      <button class="chip" type="button" data-ask="Explain what this shows, simply.">Explain this</button>
      <button class="chip" type="button" data-ask="Walk me through this step by step.">Step by step</button>
      <button class="chip" type="button" data-ask="Give me 3 quick questions to test myself on this.">Quiz me</button>
    </div>
    <button class="x" type="button" id="unattach" aria-label="Remove the snip" title="Remove the snip">✕</button>
  </div>
  <form class="c-compose" id="compose">
    <button class="icon-b" type="button" id="snip" title="Snip part of the screen to ask about it" aria-label="Snip part of the screen">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7V4.5A1.5 1.5 0 0 1 4.5 3H7M13 3h2.5A1.5 1.5 0 0 1 17 4.5V7M17 13v2.5a1.5 1.5 0 0 1-1.5 1.5H13M7 17H4.5A1.5 1.5 0 0 1 3 15.5V13" /><circle cx="10" cy="10" r="2.2" /></svg>
    </button>
    <input type="file" id="pick" accept="image/*" hidden />
    <textarea class="input" id="msg" rows="1" maxlength="2000" placeholder="Ask about your work…" aria-label="Message"></textarea>
    <button class="btn primary" type="submit" id="send">Send</button>
  </form>
  <div class="c-note" id="note">Answers come from Groq and can be wrong. Check anything important.</div>
</div>
<script type="module" src="js/chat.js"></script>
</body>
</html>
