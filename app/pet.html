<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Togami pet</title>
<style>
  /* The desktop pet, styled after Persona 5's dialogue: the character sits in
     a slanted red card on the left; when it speaks, a striped band slashes in
     behind it and the P5 dialogue box opens to its right: a dark wedge with a
     lightning-bolt point aimed at the speaker, a white name strip rising at
     -14.65 degrees in the original (about -21 here, since the box is drawn
     taller; the speaker's name in black with one or more letters
     inverted) and a white triangle on the far end. White text inside.
     Persona 5 Royal sets dialogue in Optima Nova Black (the original release
     used KoreanKRSM). Neither can ship with Togami, so the real font is used
     when it's installed and Proza Libre ExtraBold, the closest open font, otherwise.
     The window is transparent and lets clicks through everywhere but the
     card, box and menu. */
  @font-face {
    font-family: 'P5 Text';
    font-weight: 800;
    font-display: block;
    src: local('Optima Nova LT Black'), local('OptimaNovaLT-Black'), local('Optima nova LT Black'),
      url(fonts/ProzaLibre-normal-800-latin.woff2) format('woff2');
  }
  :root {
    --red: #e3141b;
    --red-deep: #9e0a10;
    --ink: #0b0b0b;
    --box: #262626;
    --paper: #fbfbf6;
    --p5: 'P5 Text', 'Optima Nova LT', Optima, Candara, sans-serif;
  }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
  body { font-family: var(--p5); font-weight: 800; }
  #stage { position: absolute; inset: 0; }
  [hidden] { display: none !important; }

  /* ---- the card ---- */
  .card {
    position: absolute; left: 12px; bottom: 14px; width: 226px; height: 164px;
    transform: rotate(-3deg); transform-origin: 30% 80%; cursor: grab;
    filter: drop-shadow(4px 5px 0 rgba(0, 0, 0, .35));
  }
  .card:active { cursor: grabbing; }
  .card > div { position: absolute; }
  .card .edge { inset: 0; background: var(--ink); clip-path: polygon(9% 0, 100% 4%, 93% 100%, 0 95%); }
  .card .rim { inset: 5px; background: var(--paper); clip-path: polygon(9% 0, 100% 4%, 93% 100%, 0 95%); }
  .card .fill {
    inset: 10px; overflow: hidden; clip-path: polygon(9% 0, 100% 4%, 93% 100%, 0 95%);
    background:
      radial-gradient(circle, rgba(0, 0, 0, .22) 1.3px, transparent 1.8px) 0 0 / 7px 7px,
      linear-gradient(160deg, var(--red) 0 55%, var(--red-deep) 100%);
  }
  .sprite {
    position: absolute; left: -3%; bottom: -4%; width: 106%; height: auto; pointer-events: none;
    transform-origin: 50% 100%; animation: breathe 3.8s ease-in-out infinite;
  }
  .flip .sprite { scale: -1 1; }
  @keyframes breathe { 50% { transform: translateY(-2px) scaleY(1.012); } }
  .chatter .sprite { animation: chatter .26s ease-in-out infinite alternate; }
  @keyframes chatter { from { transform: translateY(0) rotate(0); } to { transform: translateY(-4px) rotate(1.2deg); } }

  .card.pop { animation: pop .42s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes pop {
    0% { transform: rotate(-3deg) translateX(-46px) scale(.86); }
    60% { transform: rotate(-1deg) translateX(6px) scale(1.04); }
    100% { transform: rotate(-3deg); }
  }
  .card.wiggle { animation: wiggle .35s ease-in-out; }
  @keyframes wiggle { 25% { transform: rotate(-7deg); } 75% { transform: rotate(1deg); } }

  /* ---- the slash band behind the card ---- */
  .band {
    position: absolute; left: -30px; bottom: 50px; width: 640px; height: 64px; pointer-events: none;
    transform: rotate(-11deg) scaleX(0); transform-origin: 0 50%; opacity: 0;
    background:
      repeating-linear-gradient(75deg, transparent 0 34px, rgba(0, 0, 0, .9) 34px 46px),
      linear-gradient(var(--red), var(--red));
    clip-path: polygon(0 0, 100% 30%, 96% 78%, 0 100%);
    transition: transform .28s cubic-bezier(.2, .9, .3, 1), opacity .18s;
  }
  .band.on { transform: rotate(-11deg) scaleX(1); opacity: 1; }
  .band.b2 {
    bottom: 24px; height: 26px; width: 600px; transition-delay: .05s;
    background: var(--ink); clip-path: polygon(0 0, 100% 40%, 98% 70%, 0 100%);
  }

  /* ---- P5 dialogue box ---- */
  .bubble { position: absolute; left: 196px; bottom: 104px; width: 356px; height: 164px; transform-origin: 0 80%; }
  .bubble.show { animation: bubble .3s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes bubble { from { transform: translateX(-30px) rotate(6deg) scale(.5); opacity: 0; } }
  .bubble svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .bubble .name {
    position: absolute; left: 17%; top: 27.5%; transform: rotate(-21deg); transform-origin: 0 100%;
    color: var(--ink); font-size: 18px; line-height: 1; white-space: pre; letter-spacing: .3px;
  }
  .bubble .name b { display: inline-block; font-weight: inherit; background: var(--ink); color: #fff; padding: 2px 3px 3px; margin: -2px 1px 0; }
  .bubble p {
    position: absolute; left: 17%; right: 21%; top: 44%; margin: 0;
    color: #fff; font-size: 15px; line-height: 1.3; letter-spacing: .2px;
  }

  /* ---- right-click menu ---- */
  .menu { position: absolute; left: 226px; bottom: 26px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .menu.show { animation: bubble .22s cubic-bezier(.2, 1.4, .4, 1); }
  .menu button {
    all: unset; cursor: pointer; padding: 6px 18px 7px 14px; transform: skewX(-12deg);
    background: var(--ink); color: #fff; font: 800 15px/1 var(--p5); letter-spacing: .4px;
    box-shadow: 4px 4px 0 var(--red); border: 2px solid var(--paper); transition: transform .1s, background .1s;
  }
  .menu button:nth-child(2) { margin-left: 12px; }
  .menu button:nth-child(3) { margin-left: 24px; }
  .menu button:nth-child(4) { margin-left: 36px; }
  .menu button:hover, .menu button:focus-visible { background: var(--red); transform: skewX(-12deg) translateX(6px); box-shadow: 4px 4px 0 var(--ink); }
  .menu button span { display: inline-block; transform: skewX(12deg); }
</style>
</head>
<body>
  <div id="stage">
    <div class="band" id="band"></div>
    <div class="band b2" id="band2"></div>
    <div class="bubble" id="bubble" hidden>
      <!-- traced from the P5 dialogue box (950 x 284) -->
      <svg viewBox="0 0 950 284" preserveAspectRatio="none" aria-hidden="true">
        <g stroke-linejoin="miter" stroke-miterlimit="10">
          <polygon points="128,128 828,70 860,276 166,236 140,250 98,206 74,218 58,192 2,166 74,150" fill="none" stroke="#0b0b0b" stroke-width="20" />
          <polygon points="128,128 828,70 860,276 166,236 140,250 98,206 74,218 58,192 2,166 74,150" fill="#262626" stroke="#fbfbf6" stroke-width="6" />
          <polygon points="68,104 440,4 478,52 134,130 96,128 112,112" fill="#fbfbf6" stroke="#0b0b0b" stroke-width="9" />
          <polygon points="870,110 946,180 742,246" fill="#fbfbf6" stroke="#0b0b0b" stroke-width="9" />
        </g>
      </svg>
      <div class="name" id="name"></div>
      <p id="text" aria-live="polite"></p>
    </div>
    <div class="card" id="card" hidden>
      <div class="edge"></div>
      <div class="rim"></div>
      <div class="fill"><img class="sprite" id="sprite" alt="" draggable="false" /></div>
    </div>
    <div class="menu" id="menu" hidden>
      <button type="button" data-act="open"><span>Open Togami</span></button>
      <button type="button" data-act="talk"><span>Talk</span></button>
      <button type="button" data-act="flip"><span>Turn around</span></button>
      <button type="button" data-act="hide"><span>Hide</span></button>
    </div>
  </div>
  <script type="module" src="js/pet.js"></script>
</body>
</html>
