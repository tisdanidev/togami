<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Togami pet</title>
<style>
  /* The desktop pet window. It has no look of its own: the installed pet pack
     brings its layout (layout.html) and styles (style.css), and js/pet.js
     puts them in #stage. The window is transparent and lets clicks through
     everywhere but the pack's #card, #bubble, #menu and #badge. */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
  #stage { position: absolute; inset: 0; }
  [hidden] { display: none !important; }
  img { -webkit-user-drag: none; }
</style>
</head>
<body>
  <div id="stage" hidden></div>
  <script type="module" src="js/pet.js"></script>
</body>
</html>
