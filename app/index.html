<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Togami</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%2315151a'/%3E%3Cpath d='M8.2 7.6 L11.2 7.6 L17.4 20.6 L13.9 20.6 Z' fill='%238ba5f0'/%3E%3Cpath d='M15.8 7.6 L12.8 7.6 L6.6 20.6 L10.1 20.6 Z' fill='%238ba5f0' opacity='.62'/%3E%3Cpath d='M9.2 3.4 H14.8 L13.9 7.8 H10.1 Z' fill='%23fbfbfa'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="fonts/fonts.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar" aria-label="Sidebar">
    <div class="sb-head">
      <a class="brand" href="#focus" aria-label="Togami, focus">
        <svg class="mark" id="mark" viewBox="0 0 24 24" aria-hidden="true">
          <path class="mark-a" d="M8.2 7.6 L11.2 7.6 L17.4 20.6 L13.9 20.6 Z" />
          <path class="mark-b" d="M15.8 7.6 L12.8 7.6 L6.6 20.6 L10.1 20.6 Z" />
          <path class="mark-knot" d="M9.2 3.4 H14.8 L13.9 7.8 H10.1 Z" />
        </svg>
        <span class="word">Togami</span>
      </a>
      <button class="icon-btn" type="button" data-act="sidebar" aria-label="Hide sidebar" title="Hide sidebar (Ctrl+\)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.5 4 5.5 8l4 4M13 4 9 8l4 4" /></svg>
      </button>
    </div>
    <nav class="sb-nav" aria-label="Sections">
      <a href="#focus" data-nav="focus"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="9" r="5.5" /><path d="M8 6v3l2 1.5M6.5 1.5h3" /></svg>Focus</a>
      <a href="#blocklist" data-nav="blocklist"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" /><path d="m4.2 11.8 7.6-7.6" /></svg>Blocklist</a>
      <a href="#ledger" data-nav="ledger"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.5h7l2 2v9h-9z" /><path d="M5.5 7h5M5.5 9.5h5M5.5 12h3" /></svg>Ledger</a>
      <a href="#settings" data-nav="settings"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2" /><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6 5 5M11 11l1.4 1.4M3.6 12.4 5 11M11 5l1.4-1.4" /></svg>Settings</a>
    </nav>
    <div class="sb-foot">
      <div class="sb-update" id="updLine" hidden></div>
      <div class="sb-status" id="status" role="status"></div>
      <div data-np="mini"></div>
    </div>
  </aside>
  <button class="icon-btn sb-show" id="sbShow" type="button" data-act="sidebar" aria-label="Show sidebar" title="Show sidebar (Ctrl+\)">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11" /></svg>
  </button>
  <main class="main"><div class="page" id="view"></div></main>
</div>

<section class="zen" id="zen" hidden aria-live="off"></section>

<div class="overlay" id="overlay" hidden></div>
<div class="force-update" id="forceUpdate" role="dialog" aria-modal="true" aria-labelledby="fuTitle" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<button class="bench-toggle" id="benchToggle" type="button" hidden>Test bench</button>
<aside class="bench" id="bench" hidden aria-label="Test bench"></aside>

<script type="module" src="js/main.js"></script>
</body>
</html>
