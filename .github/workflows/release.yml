# Push a tag like v0.2.0 to build Togami on Windows and publish a GitHub
# release. The release includes latest.json and a signed installer, which is
# what installed copies of Togami check to update themselves.
#
# Needs one repository secret: TAURI_SIGNING_PRIVATE_KEY (the updater key).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Session rule tests
        run: npm test

      - name: Blocking rule tests
        shell: bash
        run: rustc --edition 2021 --test src-tauri/src/rules.rs -o rules-test.exe && ./rules-test.exe

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Togami ${{ github.ref_name }}
          releaseBody: |
            Download **Togami_*_x64-setup.exe** below and run it. Windows may show "Windows protected your PC" because the app isn't code-signed yet: click **More info → Run anyway**.

            Installed copies update themselves from now on.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
